<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 · 张三 · 学号133</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="navbar">
        <div class="logo">
            <img src="logo.svg" alt="Logo" width="28" height="28" class="logo-svg">
            张三 · 个人简介
            <span class="badge"><i class="fas fa-user-graduate"></i> #133</span>
        </div>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="index.html#about">关于我</a>
            <a href="index.html#skills">技能</a>
            <a href="index.html#projects">项目</a>
            <a href="index.html#education">教育</a>
            <!-- 新增：注册链接 -->
            <a href="register.html">注册</a>
            <a href="message.html" class="active">留言板</a>
        </div>
        <button id="themeBtn" class="theme-btn"><i class="fas fa-moon"></i> 深色</button>
    </div>

    <div class="container">

        <div class="page-title">
            <h1><i class="fas fa-comments"></i> 留言板</h1>
            <p>欢迎留下您的建议或合作意向（留言保存在浏览器本地，刷新不会丢失）</p>
        </div>

        <!-- ========== 新增：未注册时的提示框 ========== -->
        <div id="authWarning" class="card" style="display: none; text-align: center; padding: 40px;">
            <i class="fas fa-lock" style="font-size: 48px; color: #ff6a00; margin-bottom: 20px;"></i>
            <h3>您尚未注册</h3>
            <p style="color: #888; margin: 15px 0;">为了维护良好的交流环境，请先注册账号后再进行留言。</p>
            <a href="register.html" class="submit-btn" style="text-decoration: none; display: inline-block;"><i class="fas fa-user-plus"></i> 前往注册</a>
        </div>

        <!-- ========== 新增：已登录用户欢迎栏 ========== -->
        <div id="userWelcome" class="card" style="display: none; background-color: #fff3e6; border-color: #ffcc99;">
            <p style="margin: 0; font-size: 14px;">欢迎您，<strong id="currentUserDisplay" style="color: #ff6a00;"></strong>！您可以在此留言。</p>
        </div>

        <!-- ========== 原有的留言表单，添加 id 以便控制显示隐藏 ========== -->
        <div id="messageFormContainer" class="card" style="display: none;">
            <h3><i class="fas fa-pen"></i> 写留言</h3>
            <form id="messageForm">
                <div class="form-group">
                    <label>您的姓名</label>
                    <input type="text" id="msgName" placeholder="请输入姓名（可用化名）" required>
                </div>
                <div class="form-group">
                    <label>邮箱（选填）</label>
                    <input type="email" id="msgEmail" placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>留言内容</label>
                    <textarea id="msgContent" rows="4" placeholder="请输入留言内容..." required></textarea>
                </div>
                <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> 提交留言</button>
            </form>
        </div>

        <!-- ========== 原有的留言列表，添加 id 以便控制显示隐藏 ========== -->
        <div id="messageListContainer" class="card" style="display: none;">
            <h3><i class="fas fa-list"></i> 留言列表 <small>（保存在浏览器本地）</small></h3>
            <div id="messageList"></div>
        </div>

    </div>

    <div class="footer">
        © 2026 张三 · 学号后三位 133 · 课程作业 · 参考阿里云镜像站风格
    </div>

    <script src="script.js"></script>
</body>
</html>
